<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Auction Hub">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="ball">
      <circle cx="42" cy="76" r="14"/>
    </clipPath>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#ring)"/>
  <circle cx="60" cy="60" r="48" fill="url(#face)"/>
  <!-- cricket ball -->
  <circle cx="42" cy="76" r="14" fill="#DC2626"/>
  <g clip-path="url(#ball)" fill="none" stroke="#FDE68A" stroke-width="1.6" stroke-dasharray="2 2">
    <path d="M36 61 Q44 76 36 91"/>
    <path d="M42 61 Q50 76 42 91"/>
  </g>
  <!-- gavel -->
  <g transform="rotate(-45 72 50)">
    <rect x="60" y="30" width="24" height="13" rx="3" fill="#FBBF24"/>
    <rect x="60" y="33.5" width="24" height="2" fill="#B45309" opacity="0.6"/>
    <rect x="60" y="38" width="24" height="2" fill="#B45309" opacity="0.6"/>
    <rect x="69.5" y="43" width="5" height="30" rx="2.5" fill="#F59E0B"/>
  </g>
</svg>
